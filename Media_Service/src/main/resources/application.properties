spring.application.name=media-service
server.port=8085

# Spring Cloud Config client (Task 2): pull centralized config from the config-server.
# "optional:" lets the service still start if the config server is down.
spring.config.import=optional:configserver:http://localhost:8888/

# In-memory H2 for local demonstration
spring.datasource.url=jdbc:h2:mem:mediadb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Eureka service discovery (Task 2 integration)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info

# Fallback if the Config Server is not connected
media.info-message=(config server not connected)
