<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Media Service - Upload</title>
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 2rem; color: #1c2530; }
        h1 { color: #1f5a8c; }
        form { max-width: 480px; display: grid; gap: .7rem; }
        label { font-size: .85rem; font-weight: 600; }
        input, select, textarea { width: 100%; padding: .45rem; border: 1px solid #c7d1db;
            border-radius: 6px; font-size: .9rem; box-sizing: border-box; }
        button { background: #1f5a8c; color: #fff; border: none; padding: .55rem;
            border-radius: 6px; cursor: pointer; font-size: .95rem; }
        a { color: #1f5a8c; }
        .err { background: #fdeaea; color: #b23; padding: .5rem .8rem; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Upload Photo</h1>
    <p><a th:href="@{/photos}">&larr; Back to photos</a></p>

    <p class="err" th:if="${error}" th:text="${error}">error</p>

    <form th:action="@{/photos/upload}" method="post">
        <div><label>Work Order ID</label><input name="workOrderId" required placeholder="WO-1004"/></div>
        <div><label>Uploader ID</label><input name="uploaderId" required placeholder="citizen-anna"/></div>
        <div><label>File name</label><input name="fileName" required placeholder="pothole.jpg"/></div>
        <div><label>File URL</label><input name="fileUrl" required placeholder="https://media.local/photos/pothole.jpg"/></div>
        <div>
            <label>File type</label>
            <select name="fileType">
                <option value="JPEG">JPEG</option>
                <option value="PNG">PNG</option>
                <option value="WEBP">WEBP</option>
            </select>
        </div>
        <div><label>File size (bytes, max 10,000,000)</label><input name="fileSize" type="number" required value="1000000"/></div>
        <div><label>Description</label><textarea name="description" rows="2"></textarea></div>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
